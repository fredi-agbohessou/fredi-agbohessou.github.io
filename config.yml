          subtitle: "Hello and welcome! I am a **postdoctoral researcher** at [UMR Eco&Sols](https://www.umr-ecosols.fr/)/[Cirad](https://www.cirad.fr/en), working on **modeling** the impact of climatic stresses on the functioning of rubber trees (*Hevea brasiliensis*). I use data and models to investigate biological processes occurring in both **natural and managed ecosystems**."
